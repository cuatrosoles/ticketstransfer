buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "27.1.12297006"
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.4.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

apply plugin: "com.facebook.react.rootproject"

// Firestore+BOM 32.x mezcla protolite-well-known-types (protobuf 3.14) con grpc-protobuf-lite (3.22) → mergeExtDex
// puede fallar (SourceContext$Builder «>()» no representable). Unificar protobuf antes del merge dex.
subprojects { sub ->
  sub.configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
      if (details.requested.group == 'com.google.protobuf' && details.requested.name == 'protobuf-javalite') {
        details.useVersion '3.25.5'
        details.because 'Unificar protobuf javalite (evita corrupción bytecode en mergeExtDex con Firestore/grpc)'
      }
    }
  }
}
