# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM del daemon Gradle.
# - Si el daemon desaparece y hay hs_err_pid*.log con JBR 21 + C1 CompilerThread: usar JDK 17 para
#   `./gradlew` (brew install --cask temurin@17, o export JAVA_HOME="$(/usr/libexec/java_home -v 17)").
# - Evitar G1GC en daemons muy vivos: con Temurin 17 + Darwin 25 suele aparecer SIGSEGV en
#   G1ParScanThreadState::do_copy_to_survivor_space (no es OOM). ParallelGC es más estable aquí.
# - Darwin 25/26 + Temurin 17: SIGSEGV en C2 (p. ej. Klass::search_secondary_supers en el daemon).
#   -XX:TieredStopAtLevel=1 desactiva C2 y suele estabilizar el build (no combinar con SerialGC).
# - NO usar TieredStopAtLevel=1 + SerialGC: en algunos setups rompía D8/R8.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -XX:TieredStopAtLevel=1
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
# Daemon Kotlin cayendo (EOF/RMI): compilar Kotlin en proceso del worker de Gradle suele estabilizar el build.
kotlin.compiler.execution.strategy=in-process

# El includeBuild de @react-native/gradle-plugin usa kotlin { jvmToolchain(17) }. Con la
# descarga automatica activa, Gradle puede llamar a APIs remotas ("vendor list") y fallar
# si JetBrains/Foojay responden error o estan en mantenimiento. Con false se usa solo el
# JDK ya instalado (JAVA_HOME / JBR de Android Studio), igual que en nuestros scripts npm.
org.gradle.java.installations.auto-download=false

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# Silencia warning de AGP con compileSdk 36
android.suppressUnsupportedCompileSdk=36,35

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
# Deshabilitado: con true, react-native-safe-area-context y react-native-screens
# fallan al compilar C++ (Yoga/Fabric incompatibles con RN 0.73). Con false
# se usa el bridge clásico y el build termina correctamente.
newArchEnabled=false

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=false
